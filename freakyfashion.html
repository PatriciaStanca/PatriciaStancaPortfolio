<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freaky Fashion | Patricia Stanca</title>
  <meta name="description" content="Explore Patricia Stanca's responsive Freaky Fashion React storefront.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://patriciastanca.com/freakyfashion">
  <meta property="og:title" content="Freaky Fashion | Patricia Stanca">
  <meta property="og:description" content="A responsive React storefront backed by an ASP.NET Core API.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://patriciastanca.com/freakyfashion">
  <meta property="og:image" content="https://patriciastanca.com/assets/media/projects/freaky-fashion-poster.jpg">
  <meta name="theme-color" content="#f4efe7">
  <link rel="icon" href="/assets/media/images/P.jpg" type="image/jpeg">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f4efe7;
    }

    .project-bar {
      position: fixed;
      z-index: 2;
      top: 0;
      left: 0;
      display: flex;
      width: 100%;
      min-height: 3.5rem;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem clamp(1rem, 3vw, 2.5rem);
      background: rgb(17 17 17 / 0.96);
      color: #fff;
      font: 700 0.78rem/1.2 Arial, sans-serif;
      letter-spacing: 0.05em;
    }

    .project-bar a {
      color: inherit;
      text-decoration: none;
    }

    .project-bar__links {
      display: flex;
      gap: 1.25rem;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 3.5rem);
      margin-top: 3.5rem;
      border: 0;
      background: #f4efe7;
    }

    @media (max-width: 560px) {
      .project-bar__github {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="project-bar">
    <a href="/projects" aria-label="Return to Patricia Stanca projects">← Patricia Stanca / Projects</a>
    <nav class="project-bar__links" aria-label="Freaky Fashion project links">
      <a class="project-bar__github" href="https://github.com/PatriciaStanca/FreakyFashion-Fullstack">View code ↗</a>
      <a href="/project.html?project=freaky-fashion">About the project →</a>
    </nav>
  </header>
  <iframe
    src="https://freakyfashion.patriciastanca.com"
    title="Freaky Fashion storefront"
    allow="fullscreen"
  ></iframe>
</body>
</html>
